[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pub-dados-financeiros-b3"
version = "0.1.0"
description = "Plataforma analítica de dados financeiros da B3"
readme = "README.md"
requires-python = ">=3.11.5"
license = { file = "LICENSE" }
authors = [
    { name = "Lucas Alves" }
]
dependencies = [
    "backoff>=2.2.1",
    "beautifulsoup4>=4.13.4",
    "fastparquet>=2024.11.0",
    "httpx>=0.28.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.5",
    "pandas>=2.3.2",
    "plotly>=6.7.0",
    "psycopg2>=2.9.10",
    "pyarrow>=21.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.1.1",
    "quantstats>=0.0.76",
    "requests>=2.32.5",
    "selenium>=4.35.0",
    "streamlit>=1.57.0",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.3.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pytest>=9.0.3",
]

[tool.setuptools]
package-dir = {"" = "SRC"}
py-modules = ["__list__"]

[tool.setuptools.packages.find]
where = ["SRC"]
include = ["b3_*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # Ignora linhas longas (comum em Streamlit HTML strings e consultas SQL legadas)
    "I001",  # Ignora ordem estrita de importações em scripts legados da pasta Api/
    "UP031", # Ignora formatação de string estilo antigo (percent format)
    "B018",  # Ignora expressões sem atribuição (comum em Jupyter Notebooks como analise.ipynb)
]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = ["SRC"]
